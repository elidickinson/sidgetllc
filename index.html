<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidget.com</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .sky {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: linear-gradient(to bottom, #5D9DC5 0%, #A5D8F5 100%);
            z-index: -10;
        }

        /* Blur and opacity live on the container so overlapping puffs blend as one shape */
        .cloud-container {
            position: absolute;
            opacity: 0.7;
            filter: blur(8px);
            will-change: transform;
        }

        .cloud {
            position: absolute;
            background: #E6E6E6;
            border-radius: 50%;
        }

        .content {
            position: relative;
            z-index: 10;
            padding: 10vh 20px 0;
            color: #333;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            p {
                font-size: 1rem;
            }
        }

        .small {
            margin-top: 65px;
            color: #505050;
            font-size: 1rem;
        }
        .small a {
            color: #505050;
        }

        footer {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="sky" aria-hidden="true"></div>
    <div class="content">
        <h1>SIDGET.COM</h1>
        <h2>A Digital Media Services Company</h2>
    </div>
    <footer>
        <p class="small">copyright &copy; sidget llc &nbsp;&middot;&nbsp; contact <a href="mailto:info@sidget.com">info@sidget.com</a></p>
    </footer>

    <script>
        // Cloud creation and animation system
        (function() {
            const sky = document.querySelector('.sky');
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const clouds = [];

            /**
             * Creates clouds distributed across the screen width
             */
            function createClouds() {
                const cloudCount = Math.max(3, Math.floor(window.innerWidth / 300));
                const spacing = 100 / cloudCount;

                for (let i = 0; i < cloudCount; i++) {
                    // Position clouds with some randomness to avoid perfect spacing
                    const initialX = i * spacing + (Math.random() * spacing * 0.5);
                    clouds.push(createCloud(initialX));
                }
            }

            /**
             * Creates a single cloud
             * @param {number} initialX - Starting X position for the cloud
             * @returns {object} - The cloud state, with its DOM element
             */
            function createCloud(initialX) {
                const el = document.createElement('div');
                el.className = 'cloud-container';

                // Dimensions and horizontal positions use viewport-width units
                const baseSize = Math.max(60, Math.min(120, window.innerWidth / 8)) / window.innerWidth * 100;
                const cloudWidth = baseSize + Math.random() * baseSize * 1.5;
                const heightRatio = 0.3 + Math.random() * 0.2;

                // Create a more cohesive cloud shape
                const mainCloud = document.createElement('div');
                mainCloud.className = 'cloud';
                mainCloud.style.width = cloudWidth + 'vw';
                mainCloud.style.height = (cloudWidth * heightRatio) + 'vw';
                mainCloud.style.borderRadius = '100px';
                el.appendChild(mainCloud);

                // Add puffs with significant overlap for a natural cloud look
                const puffCount = 4 + Math.floor(Math.random() * 3);

                for (let i = 0; i < puffCount; i++) {
                    const puff = document.createElement('div');
                    puff.className = 'cloud';

                    // Larger puffs for better coverage
                    const puffSize = cloudWidth * (0.5 + Math.random() * 0.3);
                    puff.style.width = (puffSize * 1.2) + 'vw';
                    puff.style.height = puffSize + 'vw';

                    // Create a tight, overlapping cluster of puffs
                    // This layout ensures puffs create a single cohesive shape
                    puff.style.top = (-puffSize * 0.4) + 'vw';

                    // Spread puffs horizontally for oblong shape
                    const horizontalPos = cloudWidth * 0.1 + Math.random() * (cloudWidth * 0.8);
                    puff.style.left = (horizontalPos - puffSize/2) + 'vw';

                    el.appendChild(puff);
                }

                sky.appendChild(el);

                const cloud = {
                    el: el,
                    x: initialX,
                    width: cloudWidth,
                    // Base speed on cloud width for a consistent feel across screen sizes
                    speed: (cloudWidth * 0.05) + (Math.random() * cloudWidth * 0.04)
                };

                place(cloud);
                return cloud;
            }

            /**
             * Positions a cloud and moves it to a random height in the top third
             */
            function place(cloud) {
                cloud.el.style.top = (Math.random() * 33) + 'vh';
                cloud.el.style.transform = `translate3d(${cloud.x}vw, 0, 0)`;
            }

            /**
             * Animation loop for all clouds
             * Uses timestamp-based animation for consistent speed across browsers
             */
            let lastTimestamp = 0;
            function animate(timestamp) {
                if (!lastTimestamp) lastTimestamp = timestamp;
                const deltaTime = (timestamp - lastTimestamp) / 1000;
                lastTimestamp = timestamp;

                for (const cloud of clouds) {
                    cloud.x += cloud.speed * deltaTime;

                    // Wrap around when a cloud moves off-screen
                    const widthFudge = 2;
                    if (cloud.x > 100 + widthFudge) {
                        cloud.x = 0 - cloud.width - widthFudge;
                        place(cloud);
                        continue;
                    }

                    cloud.el.style.transform = `translate3d(${cloud.x}vw, 0, 0)`;
                }

                requestAnimationFrame(animate);
            }

            createClouds();

            // Reduced motion keeps clouds static; viewport units still handle resizing
            if (!reduceMotion) {
                requestAnimationFrame(animate);
            }
        })();
    </script>
</body>
</html>
